<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>经营周期配置 · 凤御管理后台原型</title>
  <style>
    :root{--primary:#c0322a;--primary-hover:#a82b24;--accent:#fff0ee;--background:#fafafa;--foreground:#1a1a1a;--muted:#666;--border:#e8e8e8;--warm:#f5f2ee;--radius:8px}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}button,input{font:inherit}button{cursor:pointer}.layout{display:flex;min-height:100vh}.sidebar{width:224px;flex:none;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:100vh}.logo{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px}.logo img{width:93px;height:36px;object-fit:contain}.nav{padding:12px 8px;flex:1}.nav-title{font-size:11px;color:#999;padding:13px 12px 7px}.nav-item{display:block;width:100%;border:0;border-radius:var(--radius);background:none;text-align:left;padding:10px 12px;color:#666;margin:2px 0}.nav-item.active{background:var(--accent);color:var(--primary);font-weight:600}.nav-item.indent{padding-left:28px}.sidebar-user{border-top:1px solid var(--border);padding:12px 16px}.sidebar-user small{display:block;color:#999;margin-top:3px}.content-wrap{min-width:0;flex:1}.topbar{height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:#666}.topbar-user{display:flex;align-items:center;gap:9px}.avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:#fff;font-size:12px}.main{padding:24px;max-width:1400px}.breadcrumb{font-size:12px;color:#999;margin:0 0 22px}.breadcrumb b{color:#555;font-weight:500}.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.page-head h1{font-size:24px;margin:0;font-weight:700}.page-head p{font-size:13px;color:#888;margin:7px 0 0}.button{border:1px solid var(--border);background:#fff;padding:9px 14px;border-radius:var(--radius);color:#333;font-weight:500}.button.primary{border-color:var(--primary);background:var(--primary);color:#fff}.button.primary:hover{background:var(--primary-hover)}.button.ghost{border:0;color:var(--primary);background:none}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--border);margin-bottom:20px}.tab{border:0;background:none;padding:12px 4px;color:#666;border-bottom:2px solid transparent}.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px}.card h2{font-size:16px;margin:0 0 6px}.sub{color:#888;font-size:12px;line-height:1.7}.month-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{display:inline-block;background:var(--accent);color:var(--primary);border-radius:5px;padding:5px 8px;font-size:12px;font-weight:500}.table{width:100%;border-collapse:collapse;margin-top:15px}.table th{background:#fafafa;color:#666;font-size:12px;font-weight:600;text-align:left;padding:12px;border-bottom:1px solid var(--border)}.table td{padding:15px 12px;border-bottom:1px solid var(--border)}.table tr:last-child td{border-bottom:0}.muted{color:#999}.used{color:#b87518}.aside-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,.8fr);gap:18px}.info{background:#f8f7f6;border-radius:8px;padding:13px;font-size:12px;color:#666;line-height:1.7;margin-top:15px}.log{padding:13px 0;border-bottom:1px solid var(--border)}.log:last-child{border:0}.log b{font-size:13px}.log small{display:block;color:#999;margin-top:5px;line-height:1.5}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.43);display:flex;align-items:center;justify-content:center;padding:20px}.dialog{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:12px;box-shadow:0 20px 60px #0002;padding:22px}.dialog h2{font-size:18px;margin:0 0 5px}.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:17px 0}.edit-box{border:1px solid var(--border);border-radius:8px;padding:12px}.edit-box strong{display:block;margin-bottom:8px}.dates{display:flex;align-items:center;gap:5px}.dates input{width:50%;min-width:0;border:1px solid var(--border);border-radius:6px;padding:7px;font-size:11px}.preview{border:1px solid #eed9b1;background:#fffaf0;border-radius:8px;padding:12px;font-size:12px;line-height:1.8;color:#725b35}.error{color:#bb302b;margin:8px 0;font-size:12px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.link{color:var(--primary);text-decoration:none}.empty{padding:20px;text-align:center;color:#999}.toast{position:fixed;right:24px;bottom:24px;background:#222;color:#fff;padding:12px 17px;border-radius:8px;z-index:5}@media(max-width:800px){.sidebar{display:none}.main{padding:14px}.aside-grid,.edit-grid{grid-template-columns:1fr}.page-head{display:block}.page-head .button{margin-top:10px}.table{font-size:12px}.table td,.table th{padding:9px 5px}}
  </style>
</head>
<body>
  <div class="layout"><aside class="sidebar"><div class="logo"><img src="./assets/fengyu-admin-logo.png" alt="凤御美业"></div><nav class="nav"><div class="nav-title">工作台</div><button class="nav-item">数据看板</button><button class="nav-item">订单管理</button><button class="nav-item">服务单</button><button class="nav-item">员工管理</button><div class="nav-title">系统管理</div><button class="nav-item">组织架构</button><button class="nav-item">权限管理</button><button class="nav-item active">系统配置</button><button class="nav-item indent active">经营周期配置</button><button class="nav-item">操作日志</button></nav><div class="sidebar-user">演示管理员<small>总部管理</small></div></aside><div class="content-wrap"><header class="topbar"><span>管理后台 / 页面原型</span><span class="topbar-user"><span class="avatar">管</span> 演示管理员</span></header><main class="main"><div class="breadcrumb">系统管理 / 系统配置 / <b>经营周期配置</b></div><div class="page-head"><div><h1>经营周期配置</h1><p>设置经营月内四个不等长经营周；配置由客户管理员维护。</p></div><a class="button" style="text-decoration:none" href="./daily-summary-miniapp-v2.html" target="_blank">打开日报小程序原型 ↗</a></div><div class="tabs"><button class="tab active" data-tab="periods">周期设置</button><button class="tab" data-tab="history">修改记录</button></div><div id="app"></div></main></div></div><div id="modal"></div><div id="toast"></div>
  <script>
    const KEY='fengyu-daily-periods-v2';
    const defaults={monthStart:'2026-06-26',monthEnd:'2026-07-25',weeks:[{name:'第 1 经营周',start:'2026-06-26',end:'2026-07-02'},{name:'第 2 经营周',start:'2026-07-03',end:'2026-07-09'},{name:'第 3 经营周',start:'2026-07-10',end:'2026-07-17'},{name:'第 4 经营周',start:'2026-07-18',end:'2026-07-25'}],logs:[]};
    const read=()=>{try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{return structuredClone(defaults)}};
    const state={data:read(),draft:null,tab:'periods',open:false};
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const short=s=>s.slice(5);
    const days=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)+1;
    function validate(w){if(w[0].start!==state.data.monthStart||w[3].end!==state.data.monthEnd)return '经营周必须覆盖完整经营月。';for(let i=0;i<4;i++){if(!w[i].start||!w[i].end||w[i].start>w[i].end)return `${w[i].name}日期无效。`;if(i<3){const d=new Date(w[i].end+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+1);if(d.toISOString().slice(0,10)!==w[i+1].start)return `${w[i].name}和${w[i+1].name}必须连续且不能重叠。`}}return ''}
    function render(){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===state.tab));document.getElementById('app').innerHTML=state.tab==='history'?`<div class="card"><h2>经营周期修改记录</h2><div class="sub">展示管理员调整操作，真实系统还需记录操作人和时间。</div>${state.data.logs?.length?state.data.logs.map(x=>`<div class="log"><b>${esc(x.title)}</b><small>${esc(x.detail)}</small></div>`).join(''):'<div class="empty">暂无修改记录</div>'}</div>`:`<div class="aside-grid"><div><section class="card"><div class="month-top"><div><h2>2026 年 7 月经营月</h2><div class="sub">${short(state.data.monthStart)} 至 ${short(state.data.monthEnd)} · 四周长度由管理员配置</div></div><span class="badge">已启用</span></div><table class="table"><thead><tr><th>经营周</th><th>开始日期</th><th>结束日期</th><th>天数</th><th>状态</th></tr></thead><tbody>${state.data.weeks.map(w=>`<tr><td><strong>${esc(w.name)}</strong></td><td>${w.start}</td><td>${w.end}</td><td>${days(w.start,w.end)} 天</td><td class="${w.start<='2026-07-06'?'used':'muted'}">${w.start<='2026-07-06'?'已使用':'未开始'}</td></tr>`).join('')}</tbody></table><div style="margin-top:18px"><button class="button primary" data-action="edit">编辑四个经营周</button></div></section></div><aside><section class="card"><h2>配置说明</h2><div class="sub">保存后，小程序日报、门店目标和市场目标按同一经营周显示。原始业务日期不变。</div><div class="info">本原型使用浏览器本地存储演示后台配置流转。修改后返回小程序页面并刷新，即可查看变化。</div></section><section class="card"><h2>待客户确认</h2><div class="sub">已使用周期允许修改；历史统计是否重算、已结算工资如何处理，需另行确定。日报提交不代表工资确认。</div></section></aside></div>`;renderDialog()}
    function renderDialog(){const root=document.getElementById('modal');if(!state.open){root.innerHTML='';return}root.innerHTML=`<div class="overlay" data-action="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="编辑经营周"><h2>编辑经营周</h2><div class="sub">已使用经营周也可调整。四周应连续覆盖 ${state.data.monthStart} 至 ${state.data.monthEnd}。</div><div class="edit-grid">${state.draft.map((w,i)=>`<div class="edit-box"><strong>${esc(w.name)}</strong><div class="dates"><input type="date" data-index="${i}" data-key="start" value="${w.start}"><span>至</span><input type="date" data-index="${i}" data-key="end" value="${w.end}"></div></div>`).join('')}</div><div class="sub">试试将第 1 周结束日改为 07/06，再将第 2 周开始日改为 07/07；小程序中的 7 月 6 日将改属第 1 周。</div><div id="preview"></div><div class="actions"><button class="button" data-action="cancel">取消</button><button class="button primary" data-action="save">保存并生效</button></div></div></div>`;renderPreview()}
    function renderPreview(){const root=document.getElementById('preview');if(!root)return;const err=validate(state.draft);if(err){root.innerHTML=`<div class="error">${esc(err)}</div>`;return}const before=state.data.weeks.find(w=>w.start<='2026-07-06'&&'2026-07-06'<=w.end),after=state.draft.find(w=>w.start<='2026-07-06'&&'2026-07-06'<=w.end),changed=state.draft.filter((w,i)=>w.start!==state.data.weeks[i].start||w.end!==state.data.weeks[i].end);root.innerHTML=`<div class="preview"><strong>影响预览</strong><br>本次变更：${changed.length?changed.map(w=>w.name).join('、'):'无变更'}<br>7 月 6 日日报归属：${before?.name||'无'} → ${after?.name||'无'}<br>演示影响：员工日报 1 份、门店目标 1 项、市场目标 1 项。原始服务和销售日期不变。<br>历史统计重算与已结算工资处理：待客户确认。</div>`}
    function toast(message){const root=document.getElementById('toast');root.innerHTML=`<div class="toast">${esc(message)}</div>`;setTimeout(()=>root.innerHTML='',2500)}
    document.addEventListener('input',e=>{if(e.target.dataset.index===undefined)return;state.draft[Number(e.target.dataset.index)][e.target.dataset.key]=e.target.value;renderPreview()});
    document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;render();return}const action=e.target.closest('[data-action]');if(!action)return;const a=action.dataset.action;if(a==='overlay'&&e.target!==action)return;if(a==='edit'){state.draft=structuredClone(state.data.weeks);state.open=true;renderDialog()}if(a==='cancel'||a==='overlay'){state.open=false;renderDialog()}if(a==='save'){const err=validate(state.draft);if(err){renderPreview();return}const changed=state.draft.filter((w,i)=>w.start!==state.data.weeks[i].start||w.end!==state.data.weeks[i].end);if(changed.length){state.data.weeks=structuredClone(state.draft);state.data.logs??=[];state.data.logs.unshift({title:'修改 2026 年 7 月经营周',detail:`调整 ${changed.map(w=>w.name).join('、')}；员工日报及目标页读取新周期。`});localStorage.setItem(KEY,JSON.stringify(state.data))}state.open=false;render();toast(changed.length?'经营周期已保存':'没有需要保存的变更')}});
    render();
  </script>
</body>
</html>
