# docker-compose.remote.yml — 远程 admin / analyst 覆盖层（dev / prod 共用）
#
# 用法由 .claude/skills/remote-deploy/deploy-admin.sh 统一封装：
# 它会从 envs/<env>.env 生成仅含 DEPLOY_CLOUDBASE_ENV_ID / DEPLOY_CDN_BASE 的
# .admin-runtime.env，并以第二个 --env-file 传入。本文件禁止硬编码任一环境的桶。

name: fengyu-wxapp
services:
  admin:
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL}
      # 留空 = 由 server action 按请求 x-forwarded-proto 自动判定 Secure：
      # 当前纯 HTTP 部署 → 不加 Secure（否则浏览器丢弃 cookie → 登录后误报「未登录」）；
      # 将来接入 TLS 反代（x-forwarded-proto=https）→ 自动加 Secure，无需改配置。
      COOKIE_SECURE: ""
      JWT_SECRET: ${ADMIN_JWT_SECRET:?remote .env missing ADMIN_JWT_SECRET}
      # 登录密码 RSA 解密私钥（运行期）。缺失则 login server action fail-fast → 500。
      # 必须与构建期 inline 的 NEXT_PUBLIC_RSA_PUBLIC_KEY 同一对（见 envs/<env>.env）。
      RSA_PRIVATE_KEY: ${ADMIN_RSA_PRIVATE_KEY}
      # 与目标环境一致：worker 写入、admin 换取临时 URL 必须使用同一个 CloudBase 桶。
      CLOUDBASE_ENV_ID: ${DEPLOY_CLOUDBASE_ENV_ID:?deploy runtime env missing CLOUDBASE_ENV_ID}
      CDN_BASE: ${DEPLOY_CDN_BASE:?deploy runtime env missing CDN_BASE}
    depends_on: !reset []

  analyst:
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL}
      JWT_SECRET: ${ADMIN_JWT_SECRET:?remote .env missing ADMIN_JWT_SECRET}
      ADMIN_LOGIN_URL: ${ANALYST_ADMIN_LOGIN_URL:-http://localhost:3000/login}
      NEXT_PUBLIC_ADMIN_ORIGIN: ${ANALYST_ADMIN_ORIGIN:-http://localhost:3000}
      NEXT_PUBLIC_ANALYST_ORIGIN: ${ANALYST_PUBLIC_ORIGIN:-http://localhost:3001}
      ANALYST_VIEW_ACTION: ${ANALYST_VIEW_ACTION:-data_center:dashboard}
      ANALYST_CHAT_ACTION: ${ANALYST_CHAT_ACTION:-data_center:dashboard}
      ANALYST_EXPORT_ACTION: ${ANALYST_EXPORT_ACTION:-data_center:dashboard}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimaxi.com/v1}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    depends_on: !reset []

  cron-worker:
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL}
    depends_on: !reset []

  export-worker:
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL}
      # worker 会加载导出权限校验模块，必须使用与 admin 相同的 JWT 密钥。
      JWT_SECRET: ${ADMIN_JWT_SECRET:?remote .env missing ADMIN_JWT_SECRET}
      CLOUDBASE_ENV_ID: ${DEPLOY_CLOUDBASE_ENV_ID:?deploy runtime env missing CLOUDBASE_ENV_ID}
      CDN_BASE: ${DEPLOY_CDN_BASE:?deploy runtime env missing CDN_BASE}
    depends_on: !reset []

  # 远程 admin 连接宿主业务库 5433，不启动 compose 内的本地 PostgreSQL。
  postgres:
    profiles: ["disabled"]
