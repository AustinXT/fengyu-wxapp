# docker-compose.remote.yml — 远程 admin / analyst 覆盖层（dev / test / prod 共用）
#
# 用法由 .claude/skills/remote-deploy 下的部署脚本封装。部署脚本从本地
# envs/<env>.env 生成按服务白名单隔离的 0600 env 文件，保存在不可变 release 目录。
# 远端历史 .env 不参与新版 compose 解析，也不再整包注入任何容器。

name: fengyu-wxapp
services:
  admin:
    image: ${ADMIN_IMAGE:-fengyu-admin:latest}
    env_file: !override
      - ${ADMIN_ENV_FILE:-.admin-service.env}
    environment: !override
      TZ: Asia/Shanghai
    depends_on: !reset []

  analyst:
    image: ${ANALYST_IMAGE:-fengyu-analyst:latest}
    env_file: !override
      - ${ANALYST_ENV_FILE:-.analyst-service.env}
    environment: !override
      TZ: Asia/Shanghai
    depends_on: !reset []

  cron-worker:
    image: ${ADMIN_IMAGE:-fengyu-admin:latest}
    env_file: !override
      - ${CRON_ENV_FILE:-.cron-worker-service.env}
    environment: !override
      TZ: Asia/Shanghai
    depends_on: !reset []

  export-worker:
    image: ${ADMIN_IMAGE:-fengyu-admin:latest}
    env_file: !override
      - ${EXPORT_ENV_FILE:-.export-worker-service.env}
    environment: !override
      TZ: Asia/Shanghai
    depends_on: !reset []

  # 远程 admin 连接宿主业务库 5433，不启动 compose 内的本地 PostgreSQL。
  postgres:
    profiles: ["disabled"]
