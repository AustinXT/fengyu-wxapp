name: fengyu-wxapp
services:
  postgres:
    image: postgres:16-alpine
    container_name: fengyu-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 设置默认时区
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5434:5432"
    volumes:
      # 数据持久化
      - postgres_data:/var/lib/postgresql/data
      # 初始化脚本（首次启动时执行）
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fengyu -d fengyu"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    image: fengyu-admin:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
    container_name: fengyu-admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - COOKIE_SECURE=false
      - TENCENTCLOUD_SECRETID=${TENCENTCLOUD_SECRETID}
      - TENCENTCLOUD_SECRETKEY=${TENCENTCLOUD_SECRETKEY}
      - CLOUDBASE_ENV_ID=${CLOUDBASE_ENV_ID}
      - WX_CLIENT_APPID=${WX_CLIENT_APPID}
      - WX_CLIENT_SECRET=${WX_CLIENT_SECRET}
      - WXACODE_ENV_VERSION=${WXACODE_ENV_VERSION}
    depends_on:
      postgres:
        condition: service_healthy

  # cron-worker：迁自 fengyu-client/cloudfunctions/cronTask 的每日 03:00 定时任务
  # 复用 admin 镜像（含 cron-worker.js bundle），覆盖 entrypoint 切到 cron 入口
  cron-worker:
    image: fengyu-admin:latest
    container_name: fengyu-cron-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # node-cron 已带 timezone 参数；TZ 系统时区作双保险，避免日志时间戳混乱
      - TZ=Asia/Shanghai
      # 主动告警通道：企微机器人 webhook，缺失则 STEP 5/6 退化为 console.warn（详见 src/cron/lib/notify.ts）
      - WECHAT_BOT_WEBHOOK_URL=${WECHAT_BOT_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "cron-worker.mjs"]

volumes:
  postgres_data:
    external: true
    name: fengyu-wxapp_postgres_data

# 网络配置（可选，用于与其他服务连接）
networks:
  default:
    name: fengyu-network
