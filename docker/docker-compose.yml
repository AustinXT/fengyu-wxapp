name: fengyu-wxapp
services:
  postgres:
    image: postgres:16-alpine
    container_name: fengyu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fengyu
      POSTGRES_PASSWORD: fengyu123
      POSTGRES_DB: fengyu
      # 设置默认时区
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5434:5432"
    volumes:
      # 数据持久化
      - postgres_data:/var/lib/postgresql/data
      # 初始化脚本（首次启动时执行）
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fengyu -d fengyu"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
    container_name: fengyu-admin
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://fengyu:fengyu123@postgres:5432/fengyu
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    external: true
    name: fengyu-wxapp_postgres_data

# 网络配置（可选，用于与其他服务连接）
networks:
  default:
    name: fengyu-network
