name: fengyu-wxapp
services:
  postgres:
    image: postgres:16-alpine
    container_name: fengyu-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 设置默认时区
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5434:5432"
    volumes:
      # 数据持久化
      - postgres_data:/var/lib/postgresql/data
      # 初始化脚本（首次启动时执行）
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fengyu -d fengyu"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    image: fengyu-admin:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
    container_name: fengyu-admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - COOKIE_SECURE=false
      - PRIVATE_UPLOAD_DIR=${PRIVATE_UPLOAD_DIR:-/var/lib/fengyu/private-uploads}
      # 锁定东八区（与 cron-worker 对齐）。Dockerfile ENV 已是权威，这里显式声明双保险，
      # 防止 admin 容器跑在 UTC 导致 postgres.js 把北京墙钟时间误读、时间列晚 8 小时。
      - TZ=Asia/Shanghai
      - TENCENTCLOUD_SECRETID=${TENCENTCLOUD_SECRETID}
      - TENCENTCLOUD_SECRETKEY=${TENCENTCLOUD_SECRETKEY}
      - CLOUDBASE_ENV_ID=${CLOUDBASE_ENV_ID}
      - CDN_BASE=${CDN_BASE}
      - WX_CLIENT_APPID=${WX_CLIENT_APPID}
      - WX_CLIENT_SECRET=${WX_CLIENT_SECRET}
      - WXACODE_ENV_VERSION=${WXACODE_ENV_VERSION}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 入网资料和已签署合同仅在受保护的后台/cron 之间共享，绝不映射到 public 或 CDN。
      - ./data/private-uploads:/var/lib/fengyu/private-uploads

  analyst:
    image: fengyu-analyst:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.analyst
    container_name: fengyu-analyst
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - JWT_SECRET=${ADMIN_JWT_SECRET:-fengyu-admin-jwt-secret-dev-only}
      - ADMIN_LOGIN_URL=${ANALYST_ADMIN_LOGIN_URL:-http://localhost:3000/login}
      - NEXT_PUBLIC_ADMIN_ORIGIN=${ANALYST_ADMIN_ORIGIN:-http://localhost:3000}
      - NEXT_PUBLIC_ANALYST_ORIGIN=${ANALYST_PUBLIC_ORIGIN:-http://localhost:3001}
      - ANALYST_VIEW_ACTION=${ANALYST_VIEW_ACTION:-data_center:dashboard}
      - ANALYST_CHAT_ACTION=${ANALYST_CHAT_ACTION:-data_center:dashboard}
      - ANALYST_EXPORT_ACTION=${ANALYST_EXPORT_ACTION:-data_center:dashboard}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL:-https://api.minimaxi.com/v1}
      - MINIMAX_MODEL=${MINIMAX_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - TZ=Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy

  # cron-worker：迁自 fengyu-client/cloudfunctions/cronTask 的每日 03:00 定时任务
  # 复用 admin 镜像（含 cron-worker.js bundle），覆盖 entrypoint 切到 cron 入口
  cron-worker:
    image: fengyu-admin:latest
    container_name: fengyu-cron-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - PRIVATE_UPLOAD_DIR=${PRIVATE_UPLOAD_DIR:-/var/lib/fengyu/private-uploads}
      # node-cron 已带 timezone 参数；TZ 系统时区作双保险，避免日志时间戳混乱
      - TZ=Asia/Shanghai
      # 主动告警通道：企微机器人 webhook，缺失则 STEP 5/6 退化为 console.warn（详见 src/cron/lib/notify.ts）
      - WECHAT_BOT_WEBHOOK_URL=${WECHAT_BOT_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    # stdout/stderr 同时 tee 到挂载卷 → 容器重建不丢历史（`docker compose up` 会重建容器，
    # 默认 json-file 驱动的日志文件随旧容器目录一起删除）。文件名按月自然归档。
    # 注意：$$ 是 compose 变量转义，容器内 sh 实际拿到 $(date +%Y%m)
    volumes:
      - ./logs/cron-worker:/var/log/app
      - ./data/private-uploads:/var/lib/fengyu/private-uploads
    command:
      - sh
      - -c
      - 'node cron-worker.mjs 2>&1 | tee -a "/var/log/app/cron-worker-$$(date +%Y%m).log"'
    # docker logs 自身加滚动（即便容器不重建，避免单次容器寿命内日志无限增长）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # export-worker：持久化异步导出队列消费者。全局并发固定为 1，避免大任务抢占 admin web 进程。
  export-worker:
    image: fengyu-admin:latest
    container_name: fengyu-export-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - TZ=Asia/Shanghai
      - TENCENTCLOUD_SECRETID=${TENCENTCLOUD_SECRETID}
      - TENCENTCLOUD_SECRETKEY=${TENCENTCLOUD_SECRETKEY}
      - CLOUDBASE_ENV_ID=${CLOUDBASE_ENV_ID}
      - CDN_BASE=${CDN_BASE}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs/export-worker:/var/log/app
    command:
      - sh
      - -c
      - 'node export-worker.mjs 2>&1 | tee -a "/var/log/app/export-worker-$$(date +%Y%m).log"'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
    external: true
    name: fengyu-wxapp_postgres_data

# 网络配置（可选，用于与其他服务连接）
networks:
  default:
    name: fengyu-network
