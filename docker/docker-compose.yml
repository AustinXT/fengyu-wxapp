name: fengyu-wxapp
services:
  postgres:
    image: postgres:16-alpine
    container_name: fengyu-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 设置默认时区
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5434:5432"
    volumes:
      # 数据持久化
      - postgres_data:/var/lib/postgresql/data
      # 初始化脚本（首次启动时执行）
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fengyu -d fengyu"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
    container_name: fengyu-admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - COOKIE_SECURE=false
      - TENCENTCLOUD_SECRETID=${TENCENTCLOUD_SECRETID}
      - TENCENTCLOUD_SECRETKEY=${TENCENTCLOUD_SECRETKEY}
      - CLOUDBASE_ENV_ID=${CLOUDBASE_ENV_ID}
      - WX_CLIENT_APPID=${WX_CLIENT_APPID}
      - WX_CLIENT_SECRET=${WX_CLIENT_SECRET}
      - WXACODE_ENV_VERSION=${WXACODE_ENV_VERSION}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    external: true
    name: fengyu-wxapp_postgres_data

# 网络配置（可选，用于与其他服务连接）
networks:
  default:
    name: fengyu-network
