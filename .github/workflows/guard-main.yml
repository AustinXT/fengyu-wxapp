name: Guard main branch

# main 分支守护：私有库 + GitHub 免费版无原生分支保护（API 403）。
# 白名单：main 只接受来自 dev / test 的 PR，其余来源自动关闭 + 评论。
#   - enforce-dev-source：来源不在白名单时关闭 PR
#     · dev  = 常规开发主线
#     · test = 发布线（版本对齐 + 热修，如 PR#115/#116/#119 均由 test → main）
#   - detect-direct-push：push 到 main 且该 commit 不属于已合并 PR → 开 issue 报警
#     （只验「是否走了 PR」，不限来源分支——来源合法性已由 enforce 在 PR 阶段把关）
# 免费库无法在物理层阻止直推 main，detect 仅事后报警（默认不自动 revert）。
#
# 2026-09-13：ALLOW_NON_DEV_PR_TO_MAIN 由 'true' 改回 'false'。该开关是 6de42fac
# (2026-08-10) 为让 test 发布线能提 PR 而临时全放开的应急措施；6591799a (2026-09-01)
# 已把 test 正式纳入白名单，但应急态未同步撤销，致守护空转 34 天（任意分支均可提 PR）。

env:
  # 'true' = 完全跳过来源校验（应急逃生门）。常态保持 'false'，由上方 dev/test 白名单把关。
  # 若因新增合法来源分支而想改 'true'，优先改白名单条件，别再动这个开关。
  ALLOW_NON_DEV_PR_TO_MAIN: 'false'

on:
  pull_request:
    types: [opened, reopened, edited, ready_for_review, synchronize]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  enforce-dev-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Reject PR to main not coming from dev/test
        if: >-
          github.event.pull_request.head.ref != 'dev'
          && github.event.pull_request.head.ref != 'test'
          && env.ALLOW_NON_DEV_PR_TO_MAIN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Reject: PR -> main, but head is '$HEAD' (expected dev or test)."
          gh pr comment "$PR_NUMBER" --body "main 仅接受来自 dev 或 test 的 PR（当前 head: $HEAD）。

          请先把改动合入 dev（常规开发）或 test（发布线），再向 main 提 PR。此 PR 将被自动关闭。"
          gh pr close "$PR_NUMBER"
          exit 1

  detect-direct-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Verify push to main came via a merged PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AFTER: ${{ github.event.after }}
        run: |
          set -e
          SHORT=${AFTER:0:7}
          # after 是否属于一个 base=main 的「已合并」PR；临时允许任意来源分支。
          COUNT=$(gh api "repos/$REPO/commits/$AFTER/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | length')
          if [ "$COUNT" -gt 0 ]; then
            echo "OK: $AFTER is a legit merged PR to main."
            exit 0
          fi
          echo "WARN: $AFTER not from any merged PR to main -- opening issue."
          gh issue create --repo "$REPO" \
            --title "main 收到未经 PR 的提交 $SHORT" \
            --body "提交 $AFTER 被直接推送到 main，未通过 PR 流程。

          责任人请核查：https://github.com/$REPO/commit/$AFTER

          由 guard-main.yml 守护 workflow 自动创建。"
