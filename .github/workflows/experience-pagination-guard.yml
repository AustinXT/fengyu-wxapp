name: Experience pagination deployment guard
on:
  pull_request:
    paths:
      - 'scripts/deploy-cloudfunctions.sh'
      - 'db/scripts/_lib/assert-db-target.js'
      - 'db/package.json'
      - 'db/package-lock.json'
      - 'db/schema/product.ts'
      - 'scripts/check-experience-pagination-compat.cjs'
      - 'scripts/__tests__/experience-pagination-compat.test.cjs'
      - 'fengyu-client/cloudfunctions/clientApi/routes/product.js'
      - 'fengyu-client/miniprogram/pagesExperience/list/**'
      - 'fengyu-client/miniprogram/pagesOrder/orders/**'
      - 'fengyu-client/miniprogram/utils/cover-window.ts'
      - 'fengyu-client/tests/e2e-miniprogram/cover-window*'
      - 'db/migrations/**'
      - '.github/workflows/experience-pagination-guard.yml'
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: db
      - run: bash -n scripts/deploy-cloudfunctions.sh
      - run: node --test scripts/__tests__/experience-pagination-compat.test.cjs

  private-pg-pagination:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: issue256cireplay
        ports:
          - 54416:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: db
      - run: npm ci
        working-directory: fengyu-client/cloudfunctions/clientApi
      - run: npx drizzle-kit migrate
        working-directory: db
        env:
          DATABASE_URL: postgresql://postgres:test@127.0.0.1:54416/issue256cireplay
      - run: node --test fengyu-client/tests/e2e-miniprogram/cover-window.pg.test.mjs
        env:
          COVER_WINDOW_PG_TEST_URL: postgresql://postgres:test@127.0.0.1:54416/issue256cireplay
