name: PG session timezone

on:
  pull_request:
    paths:
      - 'fengyu-admin/src/db/**'
      - 'fengyu-admin/src/instrumentation.ts'
      - 'fengyu-admin/src/cron/**'
      - 'fengyu-admin/src/export-worker/**'
      - 'fengyu-admin/src/actions/data-center/customer.ts'
      - 'fengyu-admin/src/actions/data-center/operating-master.ts'
      - 'fengyu-admin/src/lib/data-center/time-range.ts'
      - 'fengyu-admin/package*.json'
      - 'fengyu-analyst/src/db/**'
      - 'fengyu-analyst/src/instrumentation.ts'
      - 'fengyu-analyst/package*.json'
      - 'fengyu-client/cloudfunctions/**'
      - 'fengyu-staff/cloudfunctions/**'
      - 'scripts/__tests__/session-timezone.integration.mjs'
      - 'scripts/tests/session-timezone-probe.ts'
      - 'docker/Dockerfile.admin'
      - 'docker/Dockerfile.analyst'
      - 'docker/docker-compose*.yml'
      - '.github/workflows/session-timezone.yml'
  workflow_dispatch:

jobs:
  utc-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - name: Install application and driver dependencies
        run: |
          for directory in db fengyu-admin fengyu-analyst fengyu-staff/cloudfunctions/staffApi fengyu-client/cloudfunctions/clientApi fengyu-client/cloudfunctions/payNotify; do
            (cd "$directory" && npm ci)
          done
      - name: Start isolated PostgreSQL with UTC default
        run: |
          docker run -d --name timezone-ci -e POSTGRES_PASSWORD=timezone-ci -e POSTGRES_DB=timezone_ci -p 127.0.0.1:55432:5432 postgres:16 -c timezone=UTC
          for attempt in $(seq 1 30); do
            if docker exec timezone-ci pg_isready -U postgres -d timezone_ci; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify real connections, fatal overrides, midnight members and cron windows
        env:
          TEST_PG_URL: postgresql://postgres:timezone-ci@127.0.0.1:55432/timezone_ci
        run: node --test scripts/__tests__/session-timezone.integration.mjs
      - name: Remove isolated PostgreSQL
        if: always()
        run: docker rm -f timezone-ci || true
