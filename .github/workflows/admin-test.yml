name: Admin Test

on:
  push:
    branches: [main]
    paths: ['fengyu-admin/**', 'db/schema/**']
  pull_request:
    branches: [main]
    paths: ['fengyu-admin/**', 'db/schema/**']

env:
  TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test_db

defaults:
  run:
    working-directory: fengyu-admin

jobs:
  unit-test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install

      - name: Run Vitest
        run: bun run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: fengyu-admin/coverage/

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx playwright install chromium --with-deps

      - name: Run Playwright
        run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: fengyu-admin/playwright-report/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: fengyu-admin/test-results/
